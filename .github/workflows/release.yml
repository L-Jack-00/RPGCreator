name: Release (Windows build)

# Manually triggered: builds RPGCreatorStudio.exe on Windows, then creates the
# vX.Y.Z tag and a GitHub (pre-)release with the zip and SHA-256 checksums.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.1)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version matches pyproject.toml
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $pyver = $line.Matches[0].Groups[1].Value
          if ($pyver -ne $env:VERSION) { throw "pyproject.toml version $pyver != input $env:VERSION" }
          if (-not (Test-Path "docs/release-notes/v$env:VERSION.md")) { throw "Missing docs/release-notes/v$env:VERSION.md" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0.0"

      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py"

      - name: Build RPGCreatorStudio.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name RPGCreatorStudio
          --icon RPGCreatorStudio.ico
          --collect-submodules src
          RPGCreatorStudio.pyw

      - name: Assemble release folder
        shell: pwsh
        run: |
          $dist = "dist/RPGCreatorStudio"
          Copy-Item -Recurse sample_workspace "$dist/sample_workspace"
          Copy-Item RPGCreatorStudio.ico, README.md, CHANGELOG.md $dist
          Get-ChildItem -Recurse -Directory -Path "$dist/sample_workspace" -Filter ".ir_history" | Remove-Item -Recurse -Force

      - name: Smoke test packaged exe (headless CLI)
        shell: pwsh
        run: |
          $dist = (Resolve-Path "dist/RPGCreatorStudio").Path
          foreach ($cmdArgs in @(@("check", "$dist\sample_workspace\ir"), @("balance-check", "$dist\sample_workspace\ir"), @("battle-formula", "show", "$dist\sample_workspace\ir"))) {
            $p = Start-Process -FilePath "$dist\RPGCreatorStudio.exe" -ArgumentList $cmdArgs -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "exe $($cmdArgs -join ' ') exited with $($p.ExitCode)" }
          }

      - name: Zip and checksums
        shell: pwsh
        run: |
          $zip = "RPGCreator-v$env:VERSION-win64.zip"
          Compress-Archive -Path "dist/RPGCreatorStudio/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "checksums-v$env:VERSION.txt"
          Get-Content "checksums-v$env:VERSION.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-v${{ inputs.version }}
          path: |
            RPGCreator-v${{ inputs.version }}-win64.zip
            checksums-v${{ inputs.version }}.txt

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-v${{ inputs.version }}

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: RPGCreator v${{ inputs.version }} (Experimental Test Release)
          body_path: docs/release-notes/v${{ inputs.version }}.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            RPGCreator-v${{ inputs.version }}-win64.zip
            checksums-v${{ inputs.version }}.txt
